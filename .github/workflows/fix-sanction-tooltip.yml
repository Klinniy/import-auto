name: Fix sanction tooltip

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/sanction-tooltip' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanction-tooltip
          fetch-depth: 0

      - name: Remove false sanction tooltip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("import-auto-site/components/CatalogFull.tsx")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'''<span\s+className="group relative inline-flex cursor-pointer items-center"\s+aria-label="санкционный"\s*>\s*▲\s*<span[^>]*>\s*санкционный\s*</span>\s*</span>\{" "\}''',
              re.S,
          )

          text, count = pattern.subn('<span aria-hidden="true">▲</span>{" "}', text)
          if count != 2:
              raise SystemExit(f"Expected 2 false sanction tooltip blocks, found {count}")

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/fix-sanction-tooltip.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import-auto-site/components/CatalogFull.tsx .github/workflows/fix-sanction-tooltip.yml
          git commit -m "Fix false sanction tooltip in catalog"
          git push origin HEAD:fix/sanction-tooltip
