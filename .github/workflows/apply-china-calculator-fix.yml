name: Apply China calculator duty fix

on:
  push:
    branches:
      - fix/china-calculator-authoritative-duty

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/china-calculator-authoritative-duty
          fetch-depth: 0

      - name: Apply authoritative Calcos duty total
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          route_path = Path('import-auto-site/app/api/calculator/china/route.ts')
          text = route_path.read_text(encoding='utf-8')

          old_logic = re.compile(r'''  const dutyInfo = params\.taxMode === 1 \? params\.calcos\.jurInfo : params\.calcos\.fizInfo;\n  const dutyUsdTotal = params\.taxMode === 1 \? params\.calcos\.jur : params\.calcos\.fiz;\n\n  const infoSplit = splitDutyInfo\(dutyInfo\);\n\n  let customsDutyRub = 0;\n  let utilFeeRub = 0;\n\n  if \(infoSplit\.dutyPart > 0 \|\| infoSplit\.utilPart > 0\) \{\n    customsDutyRub = Math\.round\(infoSplit\.dutyPart \* usdRub\);\n    utilFeeRub = Math\.round\(infoSplit\.utilPart \* usdRub\);\n  \} else \{\n    customsDutyRub = Math\.round\(dutyUsdTotal \* usdRub\);\n    utilFeeRub = 0;\n  \}\n\n  const chinaTotalRub = carRub \+ chinaExpensesRub \+ deliveryRub;\n  const russiaTotalRub = customsDutyRub \+ utilFeeRub \+ storageRub \+ brokerRub \+ glonassRub;\n  const totalRub = chinaTotalRub \+ russiaTotalRub;''')

          new_logic = '''  const dutyInfo = params.taxMode === 1 ? params.calcos.jurInfo : params.calcos.fizInfo;
          const dutyUsdTotal = params.taxMode === 1 ? params.calcos.jur : params.calcos.fiz;

          // fiz/jur are the authoritative Calcos totals for customs duty plus utilization fee.
          // fiz_info/jur_info are explanatory fields and may omit parts of the total, so they
          // must never be used to reconstruct the amount charged to the customer.
          const customsAndUtilRub = Math.round(dutyUsdTotal * usdRub);

          const chinaTotalRub = carRub + chinaExpensesRub + deliveryRub;
          const russiaTotalRub = customsAndUtilRub + storageRub + brokerRub + glonassRub;
          const totalRub = chinaTotalRub + russiaTotalRub;'''

          text, count = old_logic.subn(new_logic, text)
          if count != 1:
              raise SystemExit(f'Expected one China duty calculation block, found {count}')

          old_rows = '''        makeRow("Таможенная пошлина", infoSplit.dutyPart, "USD", customsDutyRub),
                  makeRow("Утилизационный сбор", infoSplit.utilPart, "USD", utilFeeRub),'''
          new_rows = '''        makeRow(
                    "Таможенная пошлина и утилизационный сбор",
                    dutyUsdTotal,
                    "USD",
                    customsAndUtilRub,
                  ),'''

          if old_rows not in text:
              raise SystemExit('China duty detail rows were not found')
          text = text.replace(old_rows, new_rows, 1)
          route_path.write_text(text, encoding='utf-8')

          test_path = Path('import-auto-site/scripts/china-route-logic.test.mjs')
          test_path.write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const routeSource = await readFile(
            new URL("../app/api/calculator/china/route.ts", import.meta.url),
            "utf8",
          );

          test("China calculator uses authoritative fiz/jur total for customs and utilization", () => {
            assert.match(routeSource, /const dutyUsdTotal = params\\.taxMode === 1 \\? params\\.calcos\\.jur : params\\.calcos\\.fiz/);
            assert.match(routeSource, /const customsAndUtilRub = Math\\.round\\(dutyUsdTotal \\* usdRub\\)/);
            assert.match(routeSource, /const russiaTotalRub = customsAndUtilRub \\+ storageRub \\+ brokerRub \\+ glonassRub/);
            assert.doesNotMatch(routeSource, /customsDutyRub = Math\\.round\\(infoSplit\\.dutyPart/);
            assert.doesNotMatch(routeSource, /utilFeeRub = Math\\.round\\(infoSplit\\.utilPart/);
          });

          test("China calculator displays one combined authoritative duty row", () => {
            assert.match(routeSource, /Таможенная пошлина и утилизационный сбор/);
            assert.doesNotMatch(routeSource, /makeRow\\("Таможенная пошлина", infoSplit/);
            assert.doesNotMatch(routeSource, /makeRow\\("Утилизационный сбор", infoSplit/);
          });

          test("reference case does not lose the difference omitted by fiz_info", () => {
            const fizUsd = 25467;
            const fizInfoPartsUsd = 7957 + 12888;
            const usdRub = 78.3987;
            const authoritative = Math.round(fizUsd * usdRub);
            const incomplete = Math.round(fizInfoPartsUsd * usdRub);

            assert.equal(authoritative, 1996580);
            assert.equal(authoritative > incomplete, true);
            assert.equal(Math.round((fizUsd - fizInfoPartsUsd) * usdRub), authoritative - incomplete);
          });
          ''', encoding='utf-8')

          package_path = Path('import-auto-site/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['test:route:calculator:china'] = 'node --test scripts/china-route-logic.test.mjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cd import-auto-site
          npm ci
          npm run test:route:calculator:china
          npx tsc --noEmit --pretty false
          npm run build

      - name: Commit fix
        run: |
          rm .github/workflows/apply-china-calculator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import-auto-site/app/api/calculator/china/route.ts import-auto-site/scripts/china-route-logic.test.mjs import-auto-site/package.json .github/workflows/apply-china-calculator-fix.yml
          git commit -m "Use authoritative Calcos duty total for China"
          git push origin HEAD:fix/china-calculator-authoritative-duty
