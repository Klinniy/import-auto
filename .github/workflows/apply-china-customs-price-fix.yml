name: Apply China customs price fix

on:
  push:
    branches:
      - fix/china-calculator-authoritative-duty

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/china-calculator-authoritative-duty
          fetch-depth: 0

      - name: Include China expenses in Calcos price basis
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('import-auto-site/app/api/calculator/china/route.ts')
          text = route_path.read_text(encoding='utf-8')

          old = '''    const priceMode = String(process.env.CALCOS_CHINA_PRICE_MODE || "rub").toLowerCase();
    const priceForCalcos =
      priceMode === "raw" || priceMode === "cny"
        ? priceCny
        : Math.round(priceCny * cnyRub);

    // В расчёте поставщика 65 000 CNY расходов по Китаю входят в таможенную стоимость.
    // Calcos в текущем China-режиме получает price и sheet1 в одной рублёвой базе.
    const sheet1 = Math.round(
      clamp(
        toNumber(body.sheet1 ?? body.chinaExpensesRub ?? chinaExpensesRub, chinaExpensesRub),
        0,
        10_000_000,
      ),
    );'''

          new = '''    // Калькулятор поставщика считает пошлину от стоимости автомобиля вместе
    // с фиксированными расходами по Китаю. Calcos рассчитывает fiz/jur по price,
    // а sheet1 влияет только на строки итоговой сметы, поэтому таможенную базу
    // передаём целиком через price и не дублируем расходы через sheet1.
    const customsPriceCny = priceCny + chinaExpensesCny;
    const customsPriceRub = Math.round(customsPriceCny * cnyRub);

    const priceMode = String(process.env.CALCOS_CHINA_PRICE_MODE || "rub").toLowerCase();
    const priceForCalcos =
      priceMode === "raw" || priceMode === "cny"
        ? customsPriceCny
        : customsPriceRub;

    const sheet1 = Math.round(
      clamp(toNumber(body.sheet1, 0), 0, 10_000_000),
    );'''

          if old not in text:
              raise SystemExit('Expected China price/sheet1 block was not found')
          text = text.replace(old, new, 1)

          old_input = '''        priceCny,
        priceForCalcos,
        priceMode,
        cnyRub,
        chinaExpensesCny,
        chinaExpensesRub,
        sheet1,'''
          new_input = '''        priceCny,
        chinaExpensesCny,
        customsPriceCny,
        customsPriceRub,
        priceForCalcos,
        priceMode,
        cnyRub,
        chinaExpensesRub,
        sheet1,'''
          if old_input not in text:
              raise SystemExit('Expected China input diagnostic block was not found')
          text = text.replace(old_input, new_input, 1)

          route_path.write_text(text, encoding='utf-8')

          test_path = Path('import-auto-site/scripts/china-route-logic.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''test("China-side 65,000 CNY expenses are included in the Calcos customs base", () => {
  assert.match(routeSource, /const chinaExpensesCny = Math\.round/);
  assert.match(routeSource, /const chinaExpensesRub = Math\.round\(chinaExpensesCny \* cnyRub\)/);
  assert.match(routeSource, /body\.sheet1 \?\? body\.chinaExpensesRub \?\? chinaExpensesRub/);
  assert.doesNotMatch(routeSource, /CALCOS_CHINA_SHEET1 \?\? 8500/);
});'''
          new_test = '''test("China-side expenses are included directly in the Calcos customs price", () => {
  assert.match(routeSource, /const customsPriceCny = priceCny \+ chinaExpensesCny/);
  assert.match(routeSource, /const customsPriceRub = Math\.round\(customsPriceCny \* cnyRub\)/);
  assert.match(routeSource, /\? customsPriceCny\s*: customsPriceRub/);
  assert.match(routeSource, /clamp\(toNumber\(body\.sheet1, 0\), 0, 10_000_000\)/);
  assert.doesNotMatch(routeSource, /body\.sheet1 \?\? body\.chinaExpensesRub/);
});

test("reference China customs base contains 171800 plus 65000 CNY", () => {
  const priceCny = 171800;
  const chinaExpensesCny = 65000;
  const cnyPerUsd = 6.77;
  const missingDutyUsd = (chinaExpensesCny / cnyPerUsd) * 0.48;

  assert.equal(priceCny + chinaExpensesCny, 236800);
  assert.equal(Math.round(missingDutyUsd), 4609);
});'''
          if old_test not in test:
              raise SystemExit('Expected China customs-base test was not found')
          test = test.replace(old_test, new_test, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          cd import-auto-site
          npm ci
          npm run test:route:calculator:china
          npx tsc --noEmit --pretty false
          npm run build

      - name: Commit corrected China customs basis
        run: |
          rm -f .github/workflows/apply-china-customs-price-fix.yml
          rm -f import-auto-site/scripts/.china-customs-price-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add import-auto-site/app/api/calculator/china/route.ts import-auto-site/scripts/china-route-logic.test.mjs .github/workflows/apply-china-customs-price-fix.yml import-auto-site/scripts/.china-customs-price-trigger
          git commit -m "Include China expenses in customs price"
          git push origin HEAD:fix/china-calculator-authoritative-duty
